services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: task3-azurite
    command: >-
      azurite
      --blobHost 0.0.0.0
      --queueHost 0.0.0.0
      --skipApiVersionCheck
      --location /data
      --debug /data/debug.log
      --disableTelemetry
    ports:
      - "10000:10000"
      - "10001:10001"
    volumes:
      - ./azurite_data:/data
